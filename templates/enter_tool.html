<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a new engagement · APProved</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>
{% import "_icons.html" as icons %}

<div class="intake-page">
    <div class="intake-card">
        <a href="{{ url_for('landing') }}" class="intake-card__back">
            {{ icons.icon("arrow-left", 14) }} Back
        </a>

        <div class="row" style="margin-bottom:1rem">
            <span class="choice-card__icon" style="background:var(--blue-100);color:var(--blue-700)">
                {{ icons.icon("briefcase", 20) }}
            </span>
            <div>
                <h1 style="font-size:1.25rem;font-weight:600">Start a new engagement</h1>
                <p class="text-sm text-muted">A blank workspace — no sample data.</p>
            </div>
        </div>

        <form method="POST">
            <div class="field">
                <label class="field__label" for="client_name">Client / company name</label>
                <input class="input" type="text" name="client_name" id="client_name"
                       placeholder="e.g. Acme Medical Devices Ltd." autofocus>
                <p class="field__hint">Shown on the dashboard and in the audit trail.</p>
            </div>

            <div class="row" style="align-items:flex-start;margin-top:1rem">
                <input type="checkbox" id="consent" name="consent" required
                       style="margin-top:.2rem;width:1rem;height:1rem;flex-shrink:0">
                <label for="consent" class="text-sm text-muted">
                    I consent to APProved recording an append-only audit trail of uploads,
                    briefs and generated documents for this engagement.
                </label>
            </div>

            <button type="submit" class="btn btn--primary btn--block mt-6">
                {{ icons.icon("arrow-right", 16) }} Enter Workspace
            </button>
        </form>
    </div>
</div>
</body>
</html>
